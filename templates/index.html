<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontDesk Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 2rem;
        }
        .upload-section {
            border: 2px dashed var(--border);
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 2rem;
            background: #f1f5f9;
        }
        .chat-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-box {
            height: 400px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            padding: 1rem;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot-message {
            background: var(--surface);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        /* --- Markdown rendering inside bot bubbles --- */
        .bot-message p {
            margin: 0 0 0.6em 0;
        }
        .bot-message p:last-child {
            margin-bottom: 0;
        }
        .bot-message strong {
            font-weight: 700;
            color: #1e3a5f;
        }
        .bot-message ul, .bot-message ol {
            padding-left: 1.4rem;
            margin: 0.4em 0 0.6em;
        }
        .bot-message li {
            margin-bottom: 0.25em;
        }
        .bot-message code {
            background: #e2e8f0;
            border-radius: 4px;
            padding: 0.1em 0.4em;
            font-size: 0.88em;
            font-family: 'Courier New', Courier, monospace;
        }
        .bot-message blockquote {
            border-left: 3px solid var(--primary);
            margin: 0.5em 0;
            padding-left: 0.8em;
            color: #475569;
            font-style: italic;
        }
        .sources {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.75rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-style: italic;
        }
        .input-group {
            display: flex;
            gap: 0.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FrontDesk Assistant</h1>
        
        <div class="upload-section">
            <h3>Update Knowledge Base</h3>
            <p>Upload a PDF to instantly add it to the engine's memory.</p>
            <input type="file" id="fileInput" accept=".pdf" />
            <button onclick="uploadFile()" id="uploadBtn">Upload & Process</button>
            <p id="uploadStatus" style="font-size: 0.9rem; color: #64748b;"></p>
        </div>

        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="message bot-message">
                    Hello! I am your FrontDesk assistant. Ask me anything about the documents in my knowledge base.
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="questionInput" placeholder="e.g. How many hours of work do I have if I am remote?" onkeypress="handleKeyPress(event)" />
                <button onclick="askQuestion()" id="askBtn">Ask</button>
            </div>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            const btn = document.getElementById('uploadBtn');
            
            if (!fileInput.files[0]) {
                alert('Please select a file first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            btn.disabled = true;
            status.textContent = 'Uploading and generating embeddings... this may take a moment.';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (response.ok) {
                    status.textContent = result.message;
                    status.style.color = 'green';
                } else {
                    status.textContent = `Error: ${result.detail}`;
                    status.style.color = 'red';
                }
            } catch (err) {
                status.textContent = 'Failed to connect to server.';
                status.style.color = 'red';
            } finally {
                btn.disabled = false;
                fileInput.value = '';
            }
        }

        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('askBtn');
            const question = input.value.trim();
            
            if (!question) return;

            // Add user message
            appendMessage(question, 'user-message');
            input.value = '';
            btn.disabled = true;

            // Add loading message
            const loadingId = 'loading-' + Date.now();
            appendMessage('Thinking...', 'bot-message', loadingId);

            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                const result = await response.json();
                
                // Remove loading message
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    // Parse markdown to HTML, then append sources separately
                    const markdownHtml = marked.parse(result.answer || '');
                    let html = markdownHtml;
                    if (result.sources && result.sources.length > 0) {
                        html += `<div class="sources">📄 Sources: ${result.sources.join(', ')}</div>`;
                    }
                    appendMessage(html, 'bot-message', null, true);
                } else {
                    appendMessage(`Error: ${result.detail}`, 'bot-message');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('Failed to connect to server.', 'bot-message');
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        function appendMessage(text, className, id = null, isHtml = false) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if (id) div.id = id;
            
            if (isHtml) {
                div.innerHTML = text;
            } else if (className === 'bot-message') {
                // Always render bot plain-text messages through markdown as well
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        }
    </script>
</body>
</html>
